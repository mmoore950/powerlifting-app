name: PowerliftingApp
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
packages:
  LiftingCore:
    path: Packages/LiftingCore
targets:
  PowerliftingApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.powerliftingapp
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lift Toolkit
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - package: LiftingCore
    scheme:
      testTargets:
        - package: LiftingCore/LiftingCoreTests
        - PowerliftingAppTests
        - PowerliftingAppUITests
  PowerliftingAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.powerliftingapp.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PowerliftingApp
      - package: LiftingCore
  PowerliftingAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.powerliftingapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PowerliftingApp
    dependencies:
      - target: PowerliftingApp
